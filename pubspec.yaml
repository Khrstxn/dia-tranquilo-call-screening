publish_to: "none"
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.diatranquilo.callscreening
        pluginClass: DiaTranquiloCallScreeningPlugin
