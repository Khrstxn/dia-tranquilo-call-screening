name: Test FlutterFlow Plugin Import

on:
  workflow_dispatch:

jobs:
  test-import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Create temporary Flutter app
        run: |
          cd /tmp
          flutter create --platforms=android --project-name dia_tranquilo_import_test dia_tranquilo_import_test
          cd dia_tranquilo_import_test
          dart pub add dia_tranquilo_call_screening:"{git: https://github.com/Khrstxn/dia-tranquilo-call-screening.git}"

      - name: Create import test
        run: |
          cd /tmp/dia_tranquilo_import_test
          cat > lib/main.dart <<'EOF'
          import 'package:dia_tranquilo_call_screening/dia_tranquilo_call_screening.dart';

          Future<void> main() async {
            await DiaTranquiloCallScreening.configurarBloqueioDesconhecidos(
              ativo: true,
            );
          }
          EOF

      - name: Analyze plugin import only
        run: |
          cd /tmp/dia_tranquilo_import_test
          flutter analyze lib/main.dart
